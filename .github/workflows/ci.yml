# UniRide continuous integration
#
# Runs on every pull request that targets main (when it is opened and every
# time new commits are pushed to it), and again after a merge into main.
# It installs our packages, checks the Django project, and runs all tests.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Our Django project (manage.py) is inside the uniride/ folder.
    defaults:
      run:
        working-directory: uniride

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (same as our Macs)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uniride/requirements.txt

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Check the Django project for problems
        run: python manage.py check

      - name: Check that no model change is missing a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: python manage.py test --verbosity 2
