{# Shared by the register and sign-in pages. #}
{% for error in form.non_field_errors %}
  <p class="error" role="alert">{{ error }}</p>
{% endfor %}

{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
      <p class="error" role="alert">{{ error }}</p>
    {% endfor %}
  </div>
{% endfor %}
