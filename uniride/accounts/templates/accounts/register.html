{% extends "base.html" %}

{% block title %}Create account - UniRide{% endblock %}

{% block content %}
  <h1>Create account</h1>
  <p>Use your @pitt.edu email address.</p>

  <form method="post" class="card">
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button class="big-button" type="submit">Create account</button>
  </form>

  <p>Already have an account? <a href="{% url 'accounts:sign_in' %}">Sign in</a></p>
{% endblock %}
