{% extends "base.html" %}

{% block title %}Sign in - UniRide{% endblock %}

{% block content %}
  <h1>Sign in</h1>

  <form method="post" class="card">
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button class="big-button" type="submit">Sign in</button>
  </form>

  <p>New to UniRide? <a href="{% url 'accounts:register' %}">Create account</a></p>
{% endblock %}
