{% extends "base.html" %}

{% block title %}New verification link - UniRide{% endblock %}

{% block content %}
  <h1>Get a new verification link</h1>
  <p>Enter the Pitt email you signed up with. The new link works for 1 hour.</p>

  <form method="post" class="card">
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button class="big-button" type="submit">Send me a new link</button>
  </form>
{% endblock %}
